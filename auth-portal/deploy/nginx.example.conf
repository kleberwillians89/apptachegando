# EXAMPLE ONLY. Merge/review in the hosting configuration; do not overwrite existing vhosts.
# HTTP context (not inside server):
log_format tch_auth_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=tch_auth_actions:10m rate=30r/m;

# HTTPS server context, with the actual certificate provisioned by the chosen hosting:
# server_name app.tachegandoapp.com.br;
# access_log /var/log/nginx/tch-auth-access.log tch_auth_safe;
# Do not copy $request, $args, $request_uri, headers, cookies, referrers or POST bodies to logs.
# Review provider/edge/WAF error logging as well: this snippet alone cannot sanitize its logs.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    client_max_body_size 8k;
    limit_req zone=tch_auth_actions burst=10 nodelay;
    limit_req_status 429;
}
